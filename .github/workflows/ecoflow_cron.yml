name: EcoFlow Status Tracker

on:
  schedule:
    # S'exécute toutes les 30 minutes (ex: 00:00, 00:30, 01:00...)
    - cron: '*/30 * * * *'
  workflow_dispatch: # Permet de lancer le script manuellement depuis GitHub

jobs:
  run-logger:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Exécuter le script d'enregistrement
        env:
          ECOFLOW_ACCESS_KEY: ${{ secrets.ECOFLOW_ACCESS_KEY }}
          SECRET_KEY_ECOFLOW: ${{ secrets.ECOFLOW_SECRET_KEY }}
          ECOFLOW_SN: ${{ secrets.ECOFLOW_SN }}
          GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
        run: python ecoflow_logger.py
